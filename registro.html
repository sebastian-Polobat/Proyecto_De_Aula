<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Registro | POLOFITSPORT
    </title>

    <link rel="stylesheet"
          href="styles.css">

</head>

<body class="login-body">

    <!-- =========================
         CAJA REGISTRO
    ========================== -->

    <div class="login-box">

        <!-- LOGO -->
        <div class="logo-login">

            <img
                src="img/logo.png"
                alt="POLOFITSPORT"
            >

        </div>


        <!-- TITULO -->
        <h1>

            Crear Cuenta

        </h1>


        <!-- SUBTITULO -->
        <h2>

            ¡Únete a POLOFITSPORT!

        </h2>


        <!-- NOMBRE -->
        <label for="nombreRegistro">

            Nombre Completo

        </label>

        <input
            type="text"
            id="nombreRegistro"
            placeholder="Juan Pérez"
        >


        <!-- CORREO -->
        <label for="correoRegistro">

            Correo Electrónico

        </label>

        <input
            type="email"
            id="correoRegistro"
            placeholder="correo@example.com"
        >


        <!-- CONTRASEÑA -->
        <label for="claveRegistro">

            Contraseña

        </label>

        <input
            type="password"
            id="claveRegistro"
            placeholder="********"
        >


        <!-- CONFIRMAR -->
        <label for="confirmarClave">

            Confirmar Contraseña

        </label>

        <input
            type="password"
            id="confirmarClave"
            placeholder="********"
        >


        <!-- BOTON -->
        <button
            onclick="registrarUsuario()"
        >

            REGISTRARSE

        </button>


        <!-- LOGIN -->
        <a href="login.html">

            ← Ya tengo cuenta

        </a>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
