<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Recuperar Contraseña | POLOFITSPORT
    </title>

    <link rel="stylesheet"
          href="styles.css">

</head>

<body class="login-body">

    <!-- =========================
         CAJA PRINCIPAL
    ========================== -->

    <div class="login-box">

        <!-- LOGO -->
        <div class="logo-login">

            <img
                src="img/logo.png"
                alt="POLOFITSPORT"
            >

        </div>


        <!-- TITULO -->
        <h2>

            RECUPERAR CONTRASEÑA

        </h2>


        <!-- TEXTO -->
        <p class="texto-recuperar">

            Ingresa tu correo electrónico y el sistema
            verificará tu cuenta para recuperar la contraseña.

        </p>


        <!-- CORREO -->
        <label>

            CORREO ELECTRÓNICO

        </label>

        <input
            type="email"
            id="correoRecuperacion"
            placeholder="polofitsport@example.com"
        >


        <!-- BOTON -->
        <button
            onclick="recuperarClave()"
        >

            ENVIAR ENLACE

        </button>


        <!-- VOLVER -->
        <a href="login.html">

            ← Volver al inicio

        </a>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
